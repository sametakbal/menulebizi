<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e9590c",
                        "background-light": "#f8f6f5",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Giriş Yap - menülebizi</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="flex min-h-screen flex-col items-center justify-center p-4">
<!-- Logo Section -->
<div class="mb-8 flex flex-col items-center text-center">
<a class="flex items-center gap-2 transition-opacity hover:opacity-80" href="/">
<div class="size-8 text-primary">
<svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M4 4H17.3334V17.3334H30.6666V30.6666H44V44H4V4Z"></path>
</svg>
</div>
<h1 class="text-3xl font-bold tracking-tight text-primary">menülebizi</h1>
</a>
<p class="mt-2 text-slate-500 dark:text-slate-400">Hesabınıza giriş yapın</p>
</div>
<!-- Login Card -->
<div class="w-full max-w-[380px]">
<div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
<form action="#" class="space-y-4" method="POST">
<!-- Error Area (Hidden or subtle placeholder) -->
<div class="hidden rounded-lg bg-red-50 p-3 text-sm text-red-600 dark:bg-red-900/20 dark:text-red-400">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-base">error</span>
<span>E-posta veya şifre hatalı.</span>
</div>
</div>
<div class="space-y-1.5">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="email">E-posta</label>
<div class="relative">
<input class="w-full rounded-lg border border-slate-200 bg-white px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" id="email" name="email" placeholder="ornek@eposta.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300" for="password">Şifre</label>
<a class="text-xs font-medium text-primary hover:underline" href="#">Şifremi unuttum</a>
</div>
<div class="relative flex items-center">
<input class="w-full rounded-lg border border-slate-200 bg-white px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<button class="w-full rounded-lg bg-primary py-3 text-sm font-semibold text-white shadow-md transition-all hover:bg-primary/90 active:scale-[0.98]" type="submit">
                    Giriş Yap
                </button>
</form>
<div class="mt-6 flex flex-col gap-3">
<div class="relative flex items-center">
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
<span class="mx-3 text-xs text-slate-400 uppercase tracking-widest">veya</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
</div>
<button class="flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white py-2.5 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
<img alt="" class="size-4" data-alt="Google G logo for authentication" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBD8-QORWVzWd8Rt3BDv4epPAMNek6_E3R9IlxFTl_3lE3RnmUidHVrViLCQktFRuIJztWCyQwPbsJCNpGaMVz9FokJohscZjPZvxP9_XRiZf9QOop4Nd9AQS5OGRsng18E-UiqlEHmaw5vUcg9NawQXQYtG67sfFCo6Fno6PtkxVYvogDDWSVAHua-NZKV32u_9GF0jaOJGBcasW6db0j30MrugUFfr3CbgRFVg-znJblmxsrKEXVpb4LOHPOyiVOU64aLgO369zI"/>
                    Google ile devam et
                </button>
</div>
</div>
<!-- Footer Link -->
<p class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
            Hesabınız yok mu? 
            <a class="font-semibold text-primary hover:underline" href="/auth/register">Kayıt olun</a>
</p>
</div>
<!-- Additional Footer -->
<div class="mt-auto py-8">
<div class="flex items-center gap-4 text-xs text-slate-400">
<a class="hover:text-primary transition-colors" href="#">Gizlilik Politikası</a>
<span class="size-1 rounded-full bg-slate-300"></span>
<a class="hover:text-primary transition-colors" href="#">Kullanım Şartları</a>
<span class="size-1 rounded-full bg-slate-300"></span>
<a class="hover:text-primary transition-colors" href="#">Destek</a>
</div>
</div>
</div>
</body></html>
